<<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hi</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial;
}


body {
    background: url('bg.jpg') no-repeat center center/cover;
}


#title {
    position: absolute;
    top: 10px;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 30px;
}


#center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 25px;
}


.icon {
    width: 80px;
    height: 80px;
    cursor: pointer;
    transition: transform 0.2s;
}

.icon:hover {
    transform: scale(1.2);
}


#startScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    color: white;
    font-size: 60px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    z-index: 10;
}


@media (max-width: 768px) {

    #title {
        font-size: 22px;
    }

    #center {
        flex-direction: column; 
        gap: 15px;
    }

    .icon {
        width: 60px;
        height: 60px;
    }

    #startScreen {
        font-size: 40px;
    }
}
</style>
</head>

<body>

<div id="startScreen">жми! жми!</div>
<div id="title">hey hi hello</div>

<div id="center">
    <img src="icons/telegram.png" class="icon" onclick="openLink('https://t.me/popgoth')">
    <img src="icons/roblox.png" class="icon" onclick="openLink('https://roblox.com/users/3887426918/profile')">
    <img src="icons/github.png" class="icon" onclick="openLink('https://github.com/egorokno')">
    <img src="icons/steam.png" class="icon" onclick="openLink('https://steamcommunity.com/id/egorokno/')">
    <img src="icons/soundcloud.png" class="icon" onclick="openLink('https://soundcloud.com/egorokno')">
    <img src="icons/tumblr.png" class="icon" onclick="openLink('https://weepingfeststranger.tumblr.com')">
</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<script>
function openLink(link) {
    window.open(link, "_blank");
}

document.getElementById("startScreen").onclick = () => {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("music").play();
};
</script>

</body>
</html>
